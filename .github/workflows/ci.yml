name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check (package must import without torch installed)
        run: PYTHONPATH=src python -c "import perceptionguard; print(perceptionguard.__name__)"

      - name: Unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Verification gates (geometry, detection, tracking)
        run: PYTHONPATH=src python scripts/smoke_m1.py

  docker:
    name: docker build + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t perceptionguard:ci .
      - name: Run verification gates in the image
        run: docker run --rm perceptionguard:ci
